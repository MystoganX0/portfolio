<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #09090e;
            background-image: radial-gradient(circle at 50% 0%, #171527 0%, transparent 50%);
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col overflow-x-hidden relative">

    <!-- Navigation -->
    <nav class="w-full max-w-7xl mx-auto px-8 py-8 flex justify-between items-center">
        <a href="#" class="text-sm font-bold tracking-tight lowercase">Khairul Hakimi</a>
        
        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-8 text-sm text-gray-400">
            <a href="#" class="hover:text-white hover:[text-shadow:0_0_10px_#8b93ff,0_0_20px_#8b93ff,0_0_40px_#8b93ff] transition-all duration-300">home</a>
            <a href="#" class="hover:text-white hover:[text-shadow:0_0_10px_#ef4444,0_0_20px_#ef4444,0_0_40px_#ef4444] transition-all duration-300">about</a>
            <a href="#" class="hover:text-white hover:[text-shadow:0_0_10px_#eab308,0_0_20px_#eab308,0_0_40px_#eab308] transition-all duration-300">projects</a>
            <a href="#" class="hover:text-white hover:[text-shadow:0_0_10px_#22c55e,0_0_20px_#22c55e,0_0_40px_#22c55e] transition-all duration-300">resume</a>
        </div>

        <!-- Mobile Menu Icon -->
        <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white focus:outline-none transition-colors duration-300 z-50 relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </nav>

    <!-- Mobile Traffic Light Menu Container -->
    <div id="traffic-light-menu" class="hidden md:hidden absolute top-24 right-8 flex-col items-end space-y-4 z-40">
        <!-- Home (Blue) -->
        <div onclick="expandTrafficItem(this)" class="traffic-item cursor-pointer flex items-center w-8 h-8 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6] transition-all duration-300 ease-out relative">
            <span class="nav-text hidden opacity-0 absolute left-3 text-white font-bold text-xs tracking-wide lowercase transition-opacity duration-300">home</span>
            <svg class="w-4 h-4 absolute right-2 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </div>
        <!-- About (Pink) -->
        <div onclick="expandTrafficItem(this)" class="traffic-item cursor-pointer flex items-center w-8 h-8 rounded-full bg-pink-500 shadow-[0_0_10px_#ec4899] transition-all duration-300 ease-out relative">
            <span class="nav-text hidden opacity-0 absolute left-3 text-white font-bold text-xs tracking-wide lowercase transition-opacity duration-300">about</span>
            <svg class="w-4 h-4 absolute right-2 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <!-- Projects (White) -->
        <div onclick="expandTrafficItem(this)" class="traffic-item cursor-pointer flex items-center w-8 h-8 rounded-full bg-white shadow-[0_0_10px_#ffffff] transition-all duration-300 ease-out relative">
            <span class="nav-text hidden opacity-0 absolute left-3 text-black font-bold text-xs tracking-wide lowercase transition-opacity duration-300">projects</span>
            <svg class="w-4 h-4 absolute right-2 text-black pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
        </div>
        <!-- Resume (Red) -->
        <div onclick="expandTrafficItem(this)" class="traffic-item cursor-pointer flex items-center w-8 h-8 rounded-full bg-[#8b93ff] shadow-[0_0_10px_#ef4444] transition-all duration-300 ease-out relative">
            <span class="nav-text hidden opacity-0 absolute left-3 text-white font-bold text-xs tracking-wide lowercase transition-opacity duration-300">resume</span>
            <svg class="w-4 h-4 absolute right-2 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
    </div>

    <!-- Hero Section -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-8 flex items-center pt-12 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center w-full">
            
            <!-- Left Column: Content -->
            <div class="flex flex-col items-start">

                <!-- Headings -->
                <h1 class="text-6xl md:text-7xl font-semibold tracking-tight leading-[1.1] mb-6">
                    Hello, I'm <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#8b93ff] to-[#6a74ff]">Khairul.</span>
                </h1>
                
                <p class="text-gray-400 text-xl mb-10 max-w-md leading-relaxed">
                    An experienced full-stack website developer with a passion for crafting unique digital experiences.
                </p>

                <!-- Call to Action Buttons -->
                <div class="flex items-center space-x-4 font-sans">
                    <a href="#" class="bg-[#818cf8] hover:bg-[#6366f1] hover:shadow-[0_0_20px_rgba(129,140,248,0.7)] text-black font-semibold px-6 py-3 rounded-lg text-sm transition-all duration-300 flex items-center">
                        Get in touch 
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>
                    <a href="#" class="border border-gray-700 hover:bg-gray-800/50 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] text-white px-6 py-3 rounded-lg text-sm font-medium transition-all duration-300">
                        Learn more
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Interaction Scripts -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('traffic-light-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }

        function expandTrafficItem(element) {
            const allItems = document.querySelectorAll('.traffic-item');
            
            allItems.forEach(item => {
                if (item !== element) {
                    item.classList.remove('w-28');
                    item.classList.add('w-8');
                    const textNode = item.querySelector('.nav-text');
                    textNode.classList.add('opacity-0');
                    setTimeout(() => textNode.classList.add('hidden'), 200);
                }
            });

            if (element.classList.contains('w-8')) {
                element.classList.remove('w-8');
                element.classList.add('w-28');
                const textNode = element.querySelector('.nav-text');
                textNode.classList.remove('hidden');
                setTimeout(() => textNode.classList.remove('opacity-0'), 100);
            } else {
                element.classList.remove('w-28');
                element.classList.add('w-8');
                const textNode = element.querySelector('.nav-text');
                textNode.classList.add('opacity-0');
                setTimeout(() => textNode.classList.add('hidden'), 200);
            }
        }
    </script>
</body>
</html>
